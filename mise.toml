# Project-local toolchain and task entry points.
# Bun is the only JS runtime/package manager for this repository.

[tools]
bun = "1.4.5"

[settings]
task.run_auto_install = false

[tasks.bootstrap]
description = "Install the project toolchain and dependencies"
run = "bash scripts/bootstrap.sh"

[tasks.validate]
description = "Run the deterministic local validation gate"
run = "bun run typecheck && bun run jsx:check && bun run test:fast"
