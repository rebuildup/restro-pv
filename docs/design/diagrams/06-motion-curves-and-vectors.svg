    <rect x="720" y="590" width="656" height="246" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
    <text x="740" y="618" font-size="15" font-weight="700" fill="#18181b">4. 反単調性・禁止パターン定量ゲート（Category G 正本ルール）</text>
    <text x="740" y="646" font-size="12" fill="#18181b">• ① 時間非対称比: 往路/復路の時間比 1:1 均等を避け 1:3〜1:4（例 9f立上り vs 36f収束）を基準とする</text>
    <text x="740" y="670" font-size="12" fill="#18181b">• ② 運動軸分離: 全画同じΔで動かさず「直交Xのみ / 直交Yのみ / 固有角度回転 / 静止アンカー(S16=0)」を混在</text>
    <text x="740" y="694" font-size="12" fill="#18181b">• ③ ピボット設計: 各画 Anchor Point は画像中心ではなく実筆画バウンディング・屈曲点に個別配置</text>
    <text x="740" y="718" font-size="12" fill="#18181b">• ④ ゼロ空白: 拍境界(45, 90, 101, 191, 281, 371f)で完全停止・空白フレームを出さず残余速度を重ねる</text>
    <text x="740" y="742" font-size="12" fill="#b91c1c" font-weight="700">• ⑤ 定性レビュー必須項目: コンタクツシート上で「ゴム紐の一斉拡縮」「直線スライド感」に見えないかを人間が検品</text>
  
