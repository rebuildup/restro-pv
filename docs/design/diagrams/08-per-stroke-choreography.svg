      <text x="382" y="104" font-size="13" font-weight="700" fill="#2563eb">A2: 交差開門ホールド→抜き→上流</text>
      <text x="382" y="120" font-size="11" fill="#52525b">目的: 015/017開門と赤016の無傷連続を視認させる</text>
      <line x1="382" y1="258" x2="684" y2="258" stroke="#e4e4e7"/>
      <polyline points="382.0,258.0 387.0,257.3 392.1,255.3 397.1,252.1 402.1,247.6 407.2,242.0 412.2,235.4 417.2,228.0 422.3,219.9 427.3,211.4 432.3,202.5 437.4,193.5 442.4,184.6 447.4,176.1 452.5,168.0 457.5,160.6 462.5,154.0 467.6,148.4 472.6,143.9 477.6,140.7 482.7,138.7 487.7,138.0 492.7,138.0 497.8,138.0 502.8,138.0 507.8,138.0 512.9,138.0 517.9,138.0 522.9,138.0 528.0,138.0 533.0,138.0 538.0,138.0 543.1,138.0 548.1,138.0 553.1,138.0 558.2,138.0 563.2,138.0 568.2,138.0 573.3,138.0 578.3,138.0 583.3,138.0 588.4,138.0 593.4,138.0 598.4,138.0 603.5,138.3 608.5,139.4 613.5,141.3 618.6,144.1 623.6,147.8 628.6,152.3 633.7,157.7 638.7,163.9 643.7,170.9 648.8,178.8 653.8,187.6 658.8,197.2 663.9,207.7 668.9,219.0 673.9,231.1 679.0,244.1 684.0,258.0" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
    
    
      <rect x="716" y="82" width="326" height="190" rx="6" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/>
      <text x="728" y="104" font-size="13" font-weight="700" fill="#16a34a">B: 階段蓄積→STEP4拍一斉解放</text>
      <text x="728" y="120" font-size="11" fill="#52525b">目的: スキャン・延長・推定(静)→13画解放(動)の対比</text>
      <line x1="728" y1="258" x2="1030" y2="258" stroke="#e4e4e7"/>
      <polyline points="728.0,234.0 733.0,234.0 738.1,234.0 743.1,234.0 748.1,234.0 753.2,234.0 758.2,234.0 763.2,234.0 768.3,234.0 773.3,234.0 778.3,231.6 783.4,229.2 788.4,226.8 793.4,224.4 798.5,222.0 803.5,219.6 808.5,217.2 813.6,214.8 818.6,212.4 823.6,210.0 828.7,207.6 833.7,205.2 838.7,202.8 843.8,200.4 848.8,198.0 853.8,195.6 858.9,193.2 863.9,190.8 868.9,188.4 874.0,186.0 879.0,183.6 884.0,181.2 889.1,178.8 894.1,176.4 899.1,174.0 904.2,171.6 909.2,169.2 914.2,166.8 919.3,164.4 924.3,162.0 929.3,158.7 934.4,155.8 939.4,153.1 944.4,150.7 949.5,148.6 954.5,146.7 959.5,145.1 964.6,143.7 969.6,142.5 974.6,141.4 979.7,140.6 984.7,139.9 989.7,139.3 994.8,138.9 999.8,138.6 1004.8,138.3 1009.9,138.2 1014.9,138.1 1019.9,138.0 1025.0,138.0 1030.0,138.0" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>
    
    
      <rect x="1062" y="82" width="334" height="190" rx="6" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/>
      <text x="1074" y="104" font-size="13" font-weight="700" fill="#7c3aed">E: 低振幅呼吸収束 (PV glyph EE)</text>
      <text x="1074" y="120" font-size="11" fill="#52525b">目的: 右筆画の生命感を保ちつつCTA視認を阻害しない</text>
      <line x1="1074" y1="258" x2="1384" y2="258" stroke="#e4e4e7"/>
      <polyline points="1074.0,252.0 1079.2,251.3 1084.3,250.1 1089.5,248.3 1094.7,246.0 1099.8,243.2 1105.0,239.9 1110.2,236.3 1115.3,232.2 1120.5,227.8 1125.7,223.2 1130.8,218.4 1136.0,213.4 1141.2,208.3 1146.3,203.1 1151.5,198.0 1156.7,193.0 1161.8,188.0 1167.0,183.3 1172.2,178.8 1177.3,174.6 1182.5,170.7 1187.7,167.2 1192.8,164.0 1198.0,161.3 1203.2,159.0 1208.3,157.2 1213.5,155.9 1218.7,155.0 1223.8,154.7 1229.0,154.8 1234.2,155.4 1239.3,156.4 1244.5,157.9 1249.7,159.9 1254.8,162.1 1260.0,164.8 1265.2,167.8 1270.3,171.0 1275.5,174.5 1280.7,178.2 1285.8,182.0 1291.0,186.0 1296.2,190.0 1301.3,194.0 1306.5,198.0 1311.7,201.9 1316.8,205.7 1322.0,209.3 1327.2,212.8 1332.3,216.0 1337.5,218.9 1342.7,221.6 1347.8,224.0 1353.0,226.0 1358.2,227.6 1363.3,228.9 1368.5,229.8 1373.7,230.4 1378.8,230.6 1384.0,230.4" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
    

    <!-- Row 2: A2 Specific Stroke Roles & Collision Guard -->
    <rect x="24" y="294" width="680" height="270" rx="8" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/>
    <text x="42" y="322" font-size="15" font-weight="700" fill="#18181b">1. Scene A2「解」筆画役割分化と衝突回避（交差一点証明）</text>
    <text x="42" y="346" font-size="12" fill="#e51515" font-weight="700">• 主役アンカー [239] STROKE_016（牛の垂直縦画）: Δ=(0,0) 不動基準＋Z前出し＋#e51515 強調</text>
    <text x="42" y="370" font-size="12" fill="#2563eb" font-weight="700">• 交差ゲート [241] STROKE_015 (Δy=-374, +8°) ＆ [240] STROKE_017 (Δy=+300): 上下開門のみ</text>
    <text x="42" y="394" font-size="12" fill="#27272a">• 水平退避群 [245]003(+116x), [248]004(-72x), [243]007(+99x), [250]010(-69x): X軸のみ解放</text>
    <text x="42" y="418" font-size="12" fill="#27272a">• 回転スイング [253]002 (-42°), [251]005 (-24°): 各筆画端点/重心ピボットで左下へ干渉回避</text>
    <text x="42" y="442" font-size="12" fill="#71717a">• 未分解残存 [244],[249] (merged shape): A2交差証明を邪魔しないよう位置追従のみ・分解誇張禁止</text>
    <text x="42" y="470" font-size="12" font-weight="700" fill="#15803d">相互作用規則: ① 015/017 が開いた後の空洞を通る 016 を一瞬赤ハイライト → ② f80-90 で再定着せず</text>
    <text x="42" y="492" font-size="12" font-weight="700" fill="#15803d">   全体が Z軸ねじれ (bunkai X-20°/Y+22°) とともに上部方向へ抜け、A3橋渡しへ連続接続。</text>
    <text x="42" y="520" font-size="11.5" fill="#b91c1c">安全境界条件: 左方向へ逃げる画(004, 010)を含め x=460..480 左カラム境界を絶対に侵犯しないこと。</text>

    <!-- Row 2 Right: Scene B 13-Stroke Causal Grouping -->
    <rect x="722" y="294" width="674" height="270" rx="8" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/>
    <text x="740" y="322" font-size="15" font-weight="700" fill="#18181b">2. Scene B「筆」STEP 4 筆画構造グルーピングと相互作用</text>
    <text x="740" y="346" font-size="12" fill="#18181b" font-weight="700">• 中心統合軸 S13 (92pts縦軸+下部): 右側 (+40,+4) へ微小スライドし骨格の基準を示す</text>
    <text x="740" y="370" font-size="12" fill="#18181b">• 竹冠 左群 (S01..S03) / 右群 (S04..S06): 上部二群が干渉しない斜上/斜下ベクトルで開く</text>
    <text x="740" y="394" font-size="12" fill="#18181b">• 平行横画群「日/聿」(S09..S12): dx=-30 固定に対し dy={-5, +2, +8, +14} の等差段差で</text>
    <text x="740" y="416" font-size="12" fill="#18181b">   水平重なりを避けながら左方向へ美しく扇状分離する</text>
    <text x="740" y="444" font-size="12" fill="#007aff" font-weight="700">• 先行工程との因果: STEP 3 で29点＆12緑面を見せた直後(t=7.142s)に分離が始まるため、</text>
    <text x="740" y="466" font-size="12" fill="#007aff" font-weight="700">  「推定された隠れ形状が実体として切り離される」納得感が成立する。</text>
    <text x="740" y="498" font-size="11.5" fill="#b91c1c">※拡大鏡(420px / 300%) の中心 (757, 422) は竹冠〜主軸上交差の密集部に固定し、枠衝突回避。</text>

    <!-- Row 3: Scene C Three Work Grammars (Anti-uniformity showcase) -->
    <rect x="24" y="584" width="1372" height="252" rx="8" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/>
    <text x="42" y="612" font-size="15" font-weight="700" fill="#18181b">3. Scene C 3作例の運動文法分化（同一モーション・同一文字・同一配色の禁止）</text>

    <rect x="42" y="630" width="430" height="186" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="58" y="654" font-size="13" font-weight="700" fill="#18181b">作例 01: キネティック書き順タイポ [0.00..1.35s]</text>
    <text x="58" y="678" font-size="11.5" fill="#27272a">• 素材: 「筆」実13画または書き順構成が明快な漢字</text>
    <text x="58" y="698" font-size="11.5" fill="#27272a">• 運動法則: 書道/筆順に応じた 2段階オーバーシュート</text>
    <text x="58" y="718" font-size="11.5" fill="#27272a">  （起筆アンカー回転 ＋ 運筆方向へのスナップ伸長）</text>
    <text x="58" y="738" font-size="11.5" fill="#27272a">• 世界観: 高純度白地 (#ffffff) ＋ 濃墨 ＋ 朱アクセント</text>
    <text x="58" y="758" font-size="11.5" fill="#15803d">• B との差: 解析図の「均一分解」から「生き物のような筆運び」へ転換</text>

    <rect x="492" y="630" width="430" height="186" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="508" y="654" font-size="13" font-weight="700" fill="#f8fafc">作例 02: 3D Z空間分離パララックス [1.35..2.70s]</text>
    <text x="508" y="678" font-size="11.5" fill="#e2e8f0">• 素材: 曲線/はらいを含む別漢字（要新規Restro実出力）</text>
    <text x="508" y="698" font-size="11.5" fill="#e2e8f0">• 運動法則: カメラドリー/パン連動 × Z深度レイヤー分散</text>
    <text x="508" y="718" font-size="11.5" fill="#e2e8f0">  （手前画は大きく横切り奥の画と立体交差視差を作る）</text>
    <text x="508" y="738" font-size="11.5" fill="#e2e8f0">• 世界観: ダークスタジオ面 (#111318) × 高発光白/赤画</text>
    <text x="508" y="758" font-size="11.5" fill="#93c5fd">• 01 との差: カメラ運動主導＋暗転空間コントラスト</text>

    <rect x="942" y="630" width="434" height="186" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="958" y="654" font-size="13" font-weight="700" fill="#991b1b">作例 03: ベクター図案/モーフィング再構築 [2.70..3.75s]</text>
    <text x="958" y="678" font-size="11.5" fill="#27272a">• 素材: 別文字または文字以外の実分解ベクター（幾何再構成）</text>
    <text x="958" y="698" font-size="11.5" fill="#27272a">• 運動法則: 個別パス/頂点間のリズム変調・再編隊</text>
    <text x="958" y="718" font-size="11.5" fill="#27272a">  （元の文字枠を越えて図案パターンへ組み替わる）</text>
    <text x="958" y="738" font-size="11.5" fill="#27272a">• 世界観: グラフィックポスター調グリッド内編成</text>
    <text x="958" y="758" font-size="11.5" fill="#b91c1c">• AE直結感: 「形を変えながら動く」Dの実操作への導線</text>
  
</svg>