    <text x="24" y="34" font-size="20" font-weight="700" fill="#111111">場面別モーション文法・筆画間インタラクション比較（AEP個別曲線の一律強制を排した局所設計）</text>
    <text x="24" y="56" font-size="12" fill="#52525b">「解 runs4 の 1:4 非対称曲線」は A1 における最適解の一例であり全編の強制規約ではない。各場面は「表現目的 → 筆画の役割分化 → 固有の運動曲線」を導出する。</text>

