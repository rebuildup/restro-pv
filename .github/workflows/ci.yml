name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build:jsx
      - run: bun tools/build-jsx.ts --spec pv/smoke.ts --out dist/smoke.jsx --save .tmp/fake-smoke.aep --report .tmp/fake-smoke-report.json
      - run: bun run jsx:check
      - run: bun run test:fast
